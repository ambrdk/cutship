version: 2

project_name: cutship

before:
  hooks:
    - sh -c 'mkdir -p build && go run ./cmd/cutship schema > build/cutship.schema.json'

builds:
  - id: cutship
    main: ./cmd/cutship
    binary: cutship
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.buildVersion={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: cutship
    formats: [tar.gz]
    name_template: "cutship_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

sboms:
  - artifacts: archive

dockers_v2:
  - id: cutship
    images:
      - ghcr.io/ambrdk/cutship
    tags:
      - "{{ .Version }}"
      - "v{{ .Major }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/ambrdk/cutship
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

release:
  github:
    owner: ambrdk
    name: cutship
  extra_files:
    - glob: build/cutship.schema.json

changelog:
  disable: true
