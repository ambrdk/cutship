name: cutship
description: Install a verified cutship release and put it on PATH
inputs:
  version:
    description: Release tag to install, such as v0.3.0; empty means the release this action is pinned to
    required: false
    default: ""
outputs:
  version:
    description: Installed release tag
    value: ${{ steps.install.outputs.version }}
  path:
    description: Directory that holds the cutship binary
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.action_repository }}
        REF: ${{ inputs.version || github.action_ref }}
      run: '"$GITHUB_ACTION_PATH/scripts/install.sh" "$REPO" "$REF" "$RUNNER_TEMP/cutship" >> "$GITHUB_OUTPUT"'

    - shell: bash
      env:
        DIR: ${{ steps.install.outputs.path }}
      run: |
        echo "$DIR" >> "$GITHUB_PATH"
        "$DIR/cutship" --version
