name: cutship notify
description: Keep one Telegram post per release up to date from pull request and deploy events
inputs:
  telegram-token:
    description: Token of the bot that posts release threads
    required: true
  telegram-channel-id:
    description: Numeric id of the Telegram channel
    required: true
  github-token:
    description: Token that can read the repository, its runs and artifacts, and write pull request comments
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.action_repository }}
        REF: ${{ github.action_ref }}
      run: '"$GITHUB_ACTION_PATH/scripts/install.sh" "$REPO" "$REF" "$RUNNER_TEMP/cutship" >> "$GITHUB_OUTPUT"'

    - if: steps.release.outputs.binary == ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - id: build
      if: steps.release.outputs.binary == ''
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        go build -o "$RUNNER_TEMP/cutship/cutship" ./cmd/cutship
        echo "binary=$RUNNER_TEMP/cutship/cutship" >> "$GITHUB_OUTPUT"

    - shell: bash
      env:
        BINARY: ${{ steps.release.outputs.binary || steps.build.outputs.binary }}
        VERSION: ${{ steps.release.outputs.version || 'source' }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram-token }}
        TELEGRAM_CHANNEL_ID: ${{ inputs.telegram-channel-id }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "cutship $VERSION"
        "$BINARY" notify
