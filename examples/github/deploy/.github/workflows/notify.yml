name: notify

on:
  pull_request:
    types: [opened, reopened, closed]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: ambrdk/cutship@v0.3.0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cutship notify
