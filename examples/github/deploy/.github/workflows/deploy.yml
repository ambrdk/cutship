name: deploy

on:
  push:
    branches: [main]
    paths: ["apps/**"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      deployments: read
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      skip_ci: ${{ steps.plan.outputs.skip_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ambrdk/cutship@v0.3.0
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.before }}
        run: cutship deploy plan --base "$BASE" >> "$GITHUB_OUTPUT"

  ci:
    needs: plan
    if: needs.plan.outputs.apps != '[]' && needs.plan.outputs.skip_ci != 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [plan, ci]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.apps != '[]' && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      APPS: ${{ needs.plan.outputs.apps }}
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ambrdk/cutship@v0.3.0
      - run: cutship deploy start --apps "$APPS"
      - run: echo "deploy the apps in $APPS here, for example with ansible-playbook, and write deploy-report.json"
      - if: always()
        env:
          RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          report=()
          if [[ -f deploy-report.json ]]; then
            report=(--report deploy-report.json)
          fi
          cutship deploy finish --apps "$APPS" --result "$RESULT" "${report[@]}"
