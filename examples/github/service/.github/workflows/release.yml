name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ambrdk/cutship@v0.3.0

      - id: version
        env:
          CUTSHIP_DEPLOY_TOKEN: ${{ secrets.CUTSHIP_DEPLOY_TOKEN }}
        run: |
          tag="$(cutship version next --deploy-repo acme/deploy --app api)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.tag != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - if: steps.version.outputs.tag != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ghcr.io/acme/api:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
          CUTSHIP_DEPLOY_TOKEN: ${{ secrets.CUTSHIP_DEPLOY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cutship release --app api --tag "$TAG" --deploy-repo acme/deploy
